services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: knowledgekeeper-api
    ports:
      - "8080:8080"
    environment:
      PORT: "${PORT}"
      JWT_SECRET: "${JWT_SECRET}"
      JWT_ISSUER: "${JWT_ISSUER}"
      JWT_TTL: "${JWT_TTL}"
      JWT_REFRESH_TTL: "${JWT_REFRESH_TTL}"
      DB_HOST: "${DB_HOST}"
      DB_PORT: "${DB_PORT}"
      DB_NAME: "${DB_NAME}"
      DB_USER: "${DB_USER}"
      DB_PASSWORD: "${DB_PASSWORD}"
    depends_on:
      db:
        condition: service_healthy
      garage:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: mariadb:11.4
    container_name: knowledgekeeper-mariadb
    environment:
      MARIADB_DATABASE: "${DB_NAME}"
      MARIADB_USER: "${DB_USER}"
      MARIADB_PASSWORD: "${DB_PASSWORD}"
      MARIADB_ROOT_PASSWORD: "${MARIADB_ROOT_PASSWORD}"
    ports:
      - "3306:3306"
    volumes:
      - mariadb_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mariadb-admin", "ping", "-h", "localhost", "-p${MARIADB_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  garage:
    image: dxflrs/garage:v2.5.0
    restart: unless-stopped
    command: /garage server --single-node --default-bucket

    environment:
      GARAGE_DEFAULT_ACCESS_KEY: ${S3_ACCESS_KEY}
      GARAGE_DEFAULT_SECRET_KEY: ${S3_SECRET_KEY}
      GARAGE_DEFAULT_BUCKET: ${S3_BUCKET}

    volumes:
      - ./garage.toml:/etc/garage.toml:ro
      - garage_metadata:/var/lib/garage/meta
      - garage_data:/var/lib/garage/data

volumes:
  mariadb_data:
  garage_metadata:
  garage_data: